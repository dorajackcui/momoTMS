[project]
name = "momo-tms"
version = "0.1.0"
description = "MVP Translation Management System for Excel-based localization workflows"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "openpyxl>=3.1",
  "pydantic>=2.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
